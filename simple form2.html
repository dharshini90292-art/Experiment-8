<!DOCTYPE html>
<html>
<head>
<title>Application Registration Form</title>
</head>
<body>
<h1 style="color:#3333cc;">APPLICATION REGISTRATION FORM</h1>

<form action="/action_page.php">
<label for="fname">First Name:</label><br>
<input type="text" id="fname" name="fname" required maxlength="20"><br><br>

<label for="lname">Last Name:</label><br>
<input type="text" id="lname" name="lname" required maxlength="20"><br><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" required><br><br>

<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required><br><br>

<label for="address">Address:</label><br>
<textarea id="address" name="address" rows="4" placeholder="Enter the full address" required></textarea><br><br>

<label for="applying">Applying For:</label><br>
<select id="applying" name="applying" required>
<option value="Job">Job</option>
<option value="Internship">Internship</option>
<option value="Membership">Membership</option>
<option value="Scholarship">Scholarship</option>
<option value="Volunteer">Volunteer</option>
<option value="Other">Other</option>
</select><br><br>

<label>Educational Qualification:</label><br>
<input type="checkbox" id="level1" name="education[]" value="High School">
<label for="level1">High School</label><br>

<input type="checkbox" id="level2" name="education[]" value="Diploma">
<label for="level2">Diploma</label><br>

<input type="checkbox" id="level3" name="education[]" value="Bachelor">
<label for="level3">Bachelor</label><br>

<input type="checkbox" id="level4" name="education[]" value="Master">
<label for="level4">Master</label><br><br>

<label for="experience">Work Experience:</label><br>
<textarea id="experience" name="experience" rows="2" placeholder="Describe your previous work experience" required></textarea><br><br>

<h2>Declaration:</h2>
<label>
<input type="checkbox" name="declaration" required>
I confirm that the information provided is true and accurate.
</label><br><br>

  <input type="submit" value="Submit">
</form>
</body>
</html>
